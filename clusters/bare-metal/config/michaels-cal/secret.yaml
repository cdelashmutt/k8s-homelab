#@ load("@ytt:data", "data")
---
apiVersion: v1
kind: Secret
metadata:
  name: michaels-cal
  namespace: michaels-cal
  annotations:
    kapp.k14s.io/change-group: michaels-cal-secret
    kapp.k14s.io/change-rule: "upsert after upserting michaels-cal-namespace"
type: Opaque
stringData:
  MICHAELS_USER: #@ data.values.michaels.username
  MICHAELS_PASS: #@ data.values.michaels.password
