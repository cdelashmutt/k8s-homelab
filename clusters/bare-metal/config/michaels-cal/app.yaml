---
apiVersion: kappctrl.k14s.io/v1alpha1
kind: App
metadata:
  name: michaels-cal
  namespace: bootstrap
  annotations:
    kapp.k14s.io/change-group: michaels-cal
    kapp.k14s.io/change-rule.0: "upsert after upserting michaels-cal-namespace"
    kapp.k14s.io/change-rule.1: "upsert after upserting michaels-cal-secret"
spec:
  serviceAccountName: bootstrap
  syncPeriod: 10m
  fetch:
  - inline:
      paths:
        michaels-cal.yaml: |
          ---
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: michaels-cal
            namespace: michaels-cal
          data:
            MICHAELS_ADDRESS: "Michaels, 1445 Riverstone Pkwy Ste 100, Canton, GA 30114"
            TZ: "America/New_York"
            REFRESH_INTERVAL: "21600" # seconds between calendar refreshes
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: michaels-cal
            namespace: michaels-cal
            labels:
              app: michaels-cal
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: michaels-cal
            template:
              metadata:
                labels:
                  app: michaels-cal
              spec:
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                  runAsGroup: 1000
                  seccompProfile:
                    type: RuntimeDefault
                # imagePullSecrets:   # needed if the ghcr package is private
                #   - name: ghcr
                containers:
                  - name: michaels-cal
                    image: ghcr.io/cdelashmutt/michaels-cal:latest # change me
                    imagePullPolicy: IfNotPresent
                    ports:
                      - name: http
                        containerPort: 8080
                    envFrom:
                      - configMapRef:
                          name: michaels-cal
                      - secretRef:
                          name: michaels-cal
                    readinessProbe:
                      httpGet:
                        path: /michaels-cal.ics # ready once the first refresh succeeded
                        port: http
                      periodSeconds: 15
                      failureThreshold: 20
                    livenessProbe:
                      tcpSocket:
                        port: http
                      periodSeconds: 30
                    resources:
                      requests:
                        cpu: 50m
                        memory: 128Mi
                      limits:
                        memory: 256Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: [ALL]
                    volumeMounts:
                      - name: out
                        mountPath: /app/out
                      - name: www
                        mountPath: /srv/www
                      - name: tmp
                        mountPath: /tmp
                volumes:
                  - name: out
                    emptyDir: {}
                  - name: www
                    emptyDir: {}
                  - name: tmp
                    emptyDir: {}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: michaels-cal
            namespace: michaels-cal
          spec:
            selector:
              app: michaels-cal
            ports:
              - name: http
                port: 80
                targetPort: http
          ---
          # Optional. The calendar contains your shift schedule, so use an unguessable
          # path or add auth at the ingress if this is exposed to the internet.
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: michaels-cal
            namespace: michaels-cal
            annotations:
              tailscale.com/funnel: "true"
          spec:
            ingressClassName: tailscale
            rules:
              - http:
                  paths:
                    - path: /michaels-cal.ics
                      pathType: Exact
                      backend:
                        service:
                          name: michaels-cal
                          port:
                            name: http
            tls:
              - hosts:
                  - michaels-cal
          ---
          apiVersion: externaldns.k8s.io/v1alpha1
          kind: DNSEndpoint
          metadata:
            name: michaels-cal
            namespace: michaels-cal
          spec:
            endpoints:
              - dnsName: michaels-cal.home.grogscave.net
                recordType: CNAME
                targets: ["michaels-cal.tail272c02.ts.net"]
  template:
  - ytt: {}
  deploy:
  - kapp: {}
