#@ load("@ytt:data", "data")
---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-values
  namespace: bootstrap
type: Opaque
stringData:
  #@yaml/text-templated-strings
  values.yaml: |
    grafana:
      adminPassword: "(@= data.values.grafana.adminPassword @)"
    alertmanager:
      config:
        route:
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: "discord"
          routes:
          - matchers:
            - alertname = "Watchdog"
            receiver: "null"
          - matchers:
            - alertname = "InfoInhibitor"
            receiver: "null"
        receivers:
        - name: "null"
        - name: "discord"
          discord_configs:
          - webhook_url: "(@= data.values.alertmanager.discord.webhookUrl @)"
            send_resolved: true
        inhibit_rules:
        - source_matchers:
          - severity = "critical"
          target_matchers:
          - severity =~ "warning|info"
          equal: ["alertname", "namespace"]
        - source_matchers:
          - severity = "warning"
          target_matchers:
          - severity = "info"
          equal: ["alertname", "namespace"]
        - source_matchers:
          - alertname = "InfoInhibitor"
          target_matchers:
          - severity = "info"
          equal: ["namespace"]
