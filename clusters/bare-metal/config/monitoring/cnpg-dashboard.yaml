---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cnpg-dashboard
  namespace: monitoring
  annotations:
    kapp.k14s.io/change-rule: "upsert after upserting monitoring"
  labels:
    grafana_dashboard: "1"
data:
  cnpg.json: |
    {
      "title": "PostgreSQL (CloudNativePG)",
      "uid": "cnpg-postgres",
      "schemaVersion": 38,
      "version": 2,
      "refresh": "1m",
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "name": "cluster",
            "type": "query",
            "datasource": "prometheus",
            "query": "label_values(cnpg_collector_up, cluster)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Health",
          "type": "row",
          "collapsed": false,
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 1 },
          "panels": []
        },
        {
          "id": 2,
          "title": "Clusters Up",
          "type": "stat",
          "datasource": "prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "color": { "mode": "thresholds" },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": "prometheus",
              "expr": "count(cnpg_collector_up{cluster=~\"$cluster\"} == 1) OR vector(0)",
              "instant": true,
              "refId": "A"
            }
          ],
          "gridPos": { "x": 0, "y": 1, "w": 4, "h": 4 }
        },
        {
          "id": 3,
          "title": "Cache Hit Ratio",
          "type": "gauge",
          "datasource": "prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 90 },
                  { "color": "green", "value": 99 }
                ]
              },
              "color": { "mode": "thresholds" }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "datasource": "prometheus",
              "expr": "sum(rate(cnpg_pg_stat_database_blks_hit{cluster=~\"$cluster\"}[5m])) / (sum(rate(cnpg_pg_stat_database_blks_hit{cluster=~\"$cluster\"}[5m])) + sum(rate(cnpg_pg_stat_database_blks_read{cluster=~\"$cluster\"}[5m]))) * 100",
              "instant": true,
              "refId": "A"
            }
          ],
          "gridPos": { "x": 4, "y": 1, "w": 4, "h": 4 }
        },
        {
          "id": 4,
          "title": "Cluster Status",
          "type": "stat",
          "datasource": "prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": { "text": "Up", "color": "green" },
                    "0": { "text": "Down", "color": "red" }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "color": { "mode": "thresholds" }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": "prometheus",
              "expr": "cnpg_collector_up{cluster=~\"$cluster\"}",
              "instant": true,
              "legendFormat": "{{cluster}}",
              "refId": "A"
            }
          ],
          "gridPos": { "x": 8, "y": 1, "w": 16, "h": 4 }
        },
        {
          "id": 5,
          "title": "Connections & Transactions",
          "type": "row",
          "collapsed": false,
          "gridPos": { "x": 0, "y": 5, "w": 24, "h": 1 },
          "panels": []
        },
        {
          "id": 6,
          "title": "Active Connections by State",
          "type": "timeseries",
          "datasource": "prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "spanNulls": false
              },
              "color": { "mode": "palette-classic" }
            },
            "overrides": []
          },
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "targets": [
            {
              "datasource": "prometheus",
              "expr": "sum by (cluster, state) (cnpg_backends_total{cluster=~\"$cluster\"})",
              "legendFormat": "{{cluster}} - {{state}}",
              "refId": "A"
            }
          ],
          "gridPos": { "x": 0, "y": 6, "w": 12, "h": 8 }
        },
        {
          "id": 7,
          "title": "Transaction Rate",
          "type": "timeseries",
          "datasource": "prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "spanNulls": false
              },
              "color": { "mode": "palette-classic" }
            },
            "overrides": []
          },
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "targets": [
            {
              "datasource": "prometheus",
              "expr": "sum by (cluster) (rate(cnpg_pg_stat_database_xact_commit{cluster=~\"$cluster\"}[5m]))",
              "legendFormat": "{{cluster}} - commit",
              "refId": "A"
            },
            {
              "datasource": "prometheus",
              "expr": "sum by (cluster) (rate(cnpg_pg_stat_database_xact_rollback{cluster=~\"$cluster\"}[5m]))",
              "legendFormat": "{{cluster}} - rollback",
              "refId": "B"
            }
          ],
          "gridPos": { "x": 12, "y": 6, "w": 12, "h": 8 }
        },
        {
          "id": 8,
          "title": "Storage",
          "type": "row",
          "collapsed": false,
          "gridPos": { "x": 0, "y": 14, "w": 24, "h": 1 },
          "panels": []
        },
        {
          "id": 9,
          "title": "Database Size",
          "type": "timeseries",
          "datasource": "prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "spanNulls": false
              },
              "color": { "mode": "palette-classic" }
            },
            "overrides": []
          },
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "targets": [
            {
              "datasource": "prometheus",
              "expr": "cnpg_pg_database_size_bytes{cluster=~\"$cluster\"}",
              "legendFormat": "{{cluster}} - {{datname}}",
              "refId": "A"
            }
          ],
          "gridPos": { "x": 0, "y": 15, "w": 12, "h": 8 }
        },
        {
          "id": 10,
          "title": "WAL Size",
          "type": "timeseries",
          "datasource": "prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "spanNulls": false
              },
              "color": { "mode": "palette-classic" }
            },
            "overrides": []
          },
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "targets": [
            {
              "datasource": "prometheus",
              "expr": "cnpg_collector_pg_wal{cluster=~\"$cluster\", value=\"size\"}",
              "legendFormat": "{{cluster}}",
              "refId": "A"
            }
          ],
          "gridPos": { "x": 12, "y": 15, "w": 12, "h": 8 }
        },
        {
          "id": 11,
          "title": "Query Performance (pg_stat_statements)",
          "type": "row",
          "collapsed": false,
          "gridPos": { "x": 0, "y": 23, "w": 24, "h": 1 },
          "panels": []
        },
        {
          "id": 12,
          "title": "Top Queries by Total Time",
          "description": "Requires pg_stat_statements to be enabled on the cluster (currently only conclave-postgres has this configured)",
          "type": "table",
          "datasource": "prometheus",
          "targets": [
            {
              "datasource": "prometheus",
              "expr": "cnpg_pg_stat_statements_top_total_exec_time{cluster=~\"$cluster\"}",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "pod": true,
                  "namespace": true,
                  "container": true,
                  "endpoint": true,
                  "service": true,
                  "queryid": true
                },
                "renameByName": {
                  "Value": "Total Time (ms)",
                  "query": "Query",
                  "usename": "User",
                  "cluster": "Cluster"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [{ "field": "Total Time (ms)", "desc": true }]
              }
            }
          ],
          "fieldConfig": {
            "defaults": { "custom": { "align": "auto", "cellOptions": { "type": "auto" } } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "Total Time (ms)" }, "properties": [{ "id": "unit", "value": "ms" }, { "id": "custom.width", "value": 140 }] },
              { "matcher": { "id": "byName", "options": "Query" }, "properties": [{ "id": "custom.width", "value": 500 }] }
            ]
          },
          "options": { "showHeader": true, "cellHeight": "sm" },
          "gridPos": { "x": 0, "y": 24, "w": 24, "h": 9 }
        },
        {
          "id": 13,
          "title": "Top Queries by Mean Time",
          "type": "table",
          "datasource": "prometheus",
          "targets": [
            {
              "datasource": "prometheus",
              "expr": "cnpg_pg_stat_statements_top_mean_exec_time{cluster=~\"$cluster\"}",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "pod": true,
                  "namespace": true,
                  "container": true,
                  "endpoint": true,
                  "service": true,
                  "queryid": true
                },
                "renameByName": {
                  "Value": "Mean Time (ms)",
                  "query": "Query",
                  "usename": "User",
                  "cluster": "Cluster"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [{ "field": "Mean Time (ms)", "desc": true }]
              }
            }
          ],
          "fieldConfig": {
            "defaults": { "custom": { "align": "auto", "cellOptions": { "type": "auto" } } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "Mean Time (ms)" }, "properties": [{ "id": "unit", "value": "ms" }, { "id": "custom.width", "value": 140 }] },
              { "matcher": { "id": "byName", "options": "Query" }, "properties": [{ "id": "custom.width", "value": 500 }] }
            ]
          },
          "options": { "showHeader": true, "cellHeight": "sm" },
          "gridPos": { "x": 0, "y": 33, "w": 24, "h": 9 }
        },
        {
          "id": 14,
          "title": "Top Queries by Calls",
          "type": "table",
          "datasource": "prometheus",
          "targets": [
            {
              "datasource": "prometheus",
              "expr": "cnpg_pg_stat_statements_top_calls{cluster=~\"$cluster\"}",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "pod": true,
                  "namespace": true,
                  "container": true,
                  "endpoint": true,
                  "service": true,
                  "queryid": true
                },
                "renameByName": {
                  "Value": "Calls",
                  "query": "Query",
                  "usename": "User",
                  "cluster": "Cluster"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [{ "field": "Calls", "desc": true }]
              }
            }
          ],
          "fieldConfig": {
            "defaults": { "custom": { "align": "auto", "cellOptions": { "type": "auto" } } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "Calls" }, "properties": [{ "id": "custom.width", "value": 100 }] },
              { "matcher": { "id": "byName", "options": "Query" }, "properties": [{ "id": "custom.width", "value": 500 }] }
            ]
          },
          "options": { "showHeader": true, "cellHeight": "sm" },
          "gridPos": { "x": 0, "y": 42, "w": 24, "h": 9 }
        }
      ],
      "tags": ["homelab", "postgres", "cloudnative-pg"],
      "editable": true,
      "graphTooltip": 0,
      "links": [
        {
          "title": "Homelab Overview",
          "url": "/d/homelab-overview/homelab-overview",
          "type": "link",
          "targetBlank": false
        }
      ],
      "annotations": { "list": [] }
    }
